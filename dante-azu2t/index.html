<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dante · Si me encuentras, llama</title>
<meta name="theme-color" content="#59B6D9">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#59B6D9;--sky-light:#9AD6E6;--cream:#FBF1E1;--lime:#C9DC4B;--ink:#1E2A33;--pink:#F2A7B8;--sun:#F5B731;--coral:#E8643C}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--sky);
  background-image:radial-gradient(circle at 10% 6%,var(--sky-light) 0 80px,transparent 81px),
                   radial-gradient(circle at 96% 94%,var(--sky-light) 0 120px,transparent 121px);
  display:flex;justify-content:center;align-items:center;
  padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));
}
.card{
  width:100%;max-width:400px;height:100%;max-height:780px;
  display:flex;flex-direction:column;
  background:var(--cream);border:3px solid var(--ink);border-radius:26px;overflow:hidden;
  box-shadow:6px 6px 0 var(--ink);
}
.bar{
  flex:none;background:var(--lime);border-bottom:3px solid var(--ink);
  display:flex;align-items:center;gap:10px;padding:8px 14px;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;
}
.dot{width:14px;height:14px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink)}
.bar .x{margin-left:auto;font-size:16px;line-height:1}
.photo{
  position:relative;flex:1 1 0;min-height:150px;margin:14px 16px 0;
  border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#ddd;
}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% 68%}
.star{position:absolute;width:26px;height:26px;top:8px;right:8px;transform:rotate(12deg)}
.body{flex:none;padding:12px 18px 18px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;line-height:1}
.breed{font-weight:800;font-size:16px;background:var(--pink);border:2.5px solid var(--ink);border-radius:999px;padding:1px 12px}
.msg{margin-top:6px;font-weight:800;font-size:14px}
.btns{display:grid;gap:10px;margin-top:12px}
.call{
  display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;
  border:3px solid var(--ink);border-radius:16px;padding:8px 14px;
  box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
}
.call:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.call:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.call.mama{background:var(--coral)}
.call.acu{background:var(--sun);color:var(--ink)}
.call svg{width:24px;height:24px;flex:none}
.call span{display:block;line-height:1.1}
.who{font-weight:800;font-size:13px}
.num{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px}
@media (max-height:640px){h1{font-size:36px}.num{font-size:19px}.msg{display:none}.photo{min-height:120px}}
</style>
</head>
<body>
<main class="card">
  <div class="bar"><span class="dot"></span>Me perdí, ayúdame a volver<span class="x">✕</span></div>

  <div class="photo">
    <img src="foto.jpg" alt="Foto de Dante, Bulldog francés">
    <svg class="star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z" fill="#F5B731" stroke="#1E2A33" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>

  <div class="body">
    <div class="head"><h1>Dante</h1><span class="breed">Bulldog francés</span></div>
    <p class="msg">Si me encuentras, llama a mi mamá 🐾</p>
    <div class="btns">
      <a class="call mama" href="tel:+573118109179" aria-label="Llamar: Mamá · Katherina Amado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        <span><span class="who">Mamá · Katherina Amado</span><span class="num">311 810 9179</span></span>
      </a>
      <a class="call acu" href="tel:+573209033076" aria-label="Llamar: Acudiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        <span><span class="who">Acudiente</span><span class="num">320 903 3076</span></span>
      </a>
    </div>
  </div>
</main>
</body>
</html>
